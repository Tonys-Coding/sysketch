name: Pages

# Builds the showcase site (site/ + the repo's own example images) and publishes it to
# GitHub Pages. One-time setup: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/site.mjs'
      - 'examples/**'
      - 'docs/themes/**'
      - 'docs/logos/**'
      - 'docs/brand/**'
      - 'docs/benchmark/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
