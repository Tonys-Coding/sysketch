<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Nunito, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <linearGradient id="gUser" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#bae6fd"/></linearGradient>
    <linearGradient id="gLb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#ddd6fe"/></linearGradient>
    <linearGradient id="gApi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="gCache" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fee2e2"/><stop offset="1" stop-color="#fecaca"/></linearGradient>
    <linearGradient id="gDb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef9c3"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="44" text-anchor="middle" font-size="28" font-weight="800" fill="#0f172a">URL Shortener</text>

  <rect x="470" y="80" width="460" height="300" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="490" y="108" font-size="16" font-weight="700" fill="#64748b">Backend</text>

  <!-- client -->
  <g transform="translate(30,170)">
    <rect width="120" height="110" rx="16" fill="url(#gUser)" stroke="#0369a1" stroke-width="3"/>
    <circle cx="60" cy="38" r="14" fill="#0369a1"/>
    <path d="M32 78 C32 60 88 60 88 78 L88 84 L32 84 Z" fill="#0369a1"/>
    <text x="60" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Client</text>
  </g>
  <!-- load balancer -->
  <g transform="translate(220,170)">
    <rect width="120" height="110" rx="16" fill="url(#gLb)" stroke="#6d28d9" stroke-width="3"/>
    <circle cx="60" cy="28" r="9" fill="#6d28d9"/>
    <circle cx="34" cy="60" r="9" fill="#6d28d9"/>
    <circle cx="86" cy="60" r="9" fill="#6d28d9"/>
    <path d="M60 37 L34 51 M60 37 L86 51" stroke="#6d28d9" stroke-width="3" fill="none"/>
    <text x="60" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Load Balancer</text>
  </g>
  <!-- api -->
  <g transform="translate(500,170)">
    <rect width="120" height="110" rx="16" fill="url(#gApi)" stroke="#15803d" stroke-width="3"/>
    <rect x="34" y="20" width="52" height="16" rx="4" fill="#15803d"/>
    <rect x="34" y="42" width="52" height="16" rx="4" fill="#15803d"/>
    <rect x="34" y="64" width="52" height="16" rx="4" fill="#15803d"/>
    <circle cx="42" cy="28" r="2.5" fill="#bbf7d0"/><circle cx="42" cy="50" r="2.5" fill="#bbf7d0"/><circle cx="42" cy="72" r="2.5" fill="#bbf7d0"/>
    <text x="60" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">API Server</text>
  </g>
  <!-- cache -->
  <g transform="translate(780,110)">
    <rect width="120" height="110" rx="16" fill="url(#gCache)" stroke="#b91c1c" stroke-width="3"/>
    <path d="M60 18 L74 44 L60 70 L46 44 Z" fill="#b91c1c"/>
    <path d="M60 30 L68 44 L60 58 L52 44 Z" fill="#fecaca"/>
    <text x="60" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Cache</text>
  </g>
  <!-- db -->
  <g transform="translate(780,250)">
    <rect width="120" height="110" rx="16" fill="url(#gDb)" stroke="#b45309" stroke-width="3"/>
    <ellipse cx="60" cy="28" rx="26" ry="9" fill="#b45309"/>
    <path d="M34 28 L34 62 C34 72 86 72 86 62 L86 28" fill="#b45309"/>
    <ellipse cx="60" cy="28" rx="26" ry="9" fill="#d97706"/>
    <path d="M34 45 C34 55 86 55 86 45" stroke="#fde68a" stroke-width="2" fill="none"/>
    <text x="60" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Database</text>
  </g>

  <!-- edges -->
  <path d="M150 225 L220 225" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M340 225 L500 225" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M620 215 L700 215 L700 165 L780 165" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M620 235 L700 235 L700 305 L780 305" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- step badges -->
  <g font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">
    <circle cx="185" cy="225" r="13" fill="#f97316"/><text x="185" y="230">1</text>
    <circle cx="420" cy="225" r="13" fill="#f97316"/><text x="420" y="230">2</text>
    <circle cx="700" cy="190" r="13" fill="#f97316"/><text x="700" y="195">3</text>
    <circle cx="700" cy="280" r="13" fill="#f97316"/><text x="700" y="285">4</text>
  </g>
  <text x="185" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">POST /shorten</text>
</svg>
